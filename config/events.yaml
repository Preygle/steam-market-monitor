  - date: 2026-08-15
    name: CS2 market cap reaches new ATH ~$7B
    category: exogenous
    effect: demand_up
    scope: [all]
    note: Holding into strength, not weakness.
    confidence: medium

  - date: 2026-11-25
    name: PGL Major Singapore 2026 begins (FUTURE)
    category: major
    effect: demand_up
    scope: [sticker, souvenir]
    note: >
      FORWARD-LOOKING SELL WINDOW. Historical pattern - non-sticker items dip
      5-15% in the 4-6 weeks BEFORE a Major, then run +10-20% at peak
      viewership, staying elevated 8-15% for 1-2 weeks after. That post-Major
      fortnight is the highest-probability sell window before year end.
    confidence: high

# ---------------------------------------------------------------------
# Seasonality priors. Magnitudes are single-sourced and UNVERIFIED --
# treated as weak priors only, never as hard signals.
seasonality:
  monthly_bias:      # rough % vs trend
    1:  +0.10
    2:  +0.02
    3:  +0.05
    4:  -0.03
    5:  -0.05
    6:  -0.10
    7:  -0.15   # summer slump + Steam Summer Sale
    8:  -0.12
    9:  -0.02
    10: -0.05
    11: +0.05
    12: +0.15   # winter peak
  confidence: low
  note: >
    Directionally corroborated (summer slump / winter uplift), magnitudes
    from a single vendor blog. Used only to break ties, never to justify
    selling below floor.

# New-item price decay curve, for items released in the last ~90 days.
decay_model:
  phases:
    - {days: [0, 7],    label: launch,      expect: "elevated, thin volume, wide spread"}
    - {days: [7, 45],   label: supply_flood, expect: "grinding decline as passes are redeemed"}
    - {days: [45, 90],  label: stabilise,   expect: "trough, volume normalises"}
    - {days: [90, 999], label: maturity,    expect: "slow drift up as supply stops growing"}
  note: >
    Armory items do NOT enter the passive weekly drop pool, so their supply
    stops growing once the rotation ends. That is structurally bullish for
    patient holders and is the core reason waiting months is the right call
    for this portfolio.

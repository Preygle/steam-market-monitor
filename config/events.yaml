# CS2 market event calendar -- used to attribute price spikes/dips and to
# time sells. Sourced from Valve announcements, HLTV, and market trackers.
# `confidence` reflects how well the date was corroborated in research.
#
# effect: what it did to prices. direction is from the SELLER's point of view.
#   supply_up   -> more items exist -> prices fall
#   supply_down -> items become unobtainable -> prices rise
#   demand_up / demand_down
#
# THIS IS THE SPIKE-ATTRIBUTION KEY. When the analyser sees a >X% move in an
# item's history, it looks here for an event within the window and labels it.

events:
  - date: 2024-02-06
    name: Kilowatt Case release
    category: case_release
    effect: supply_up
    scope: [case, skin]
    note: First standard CS2 case; pressured prior newest case.
    confidence: medium   # sources disagree Feb 6 vs 7

  - date: 2024-03-21
    name: Copenhagen 2024 Major stickers released
    category: major_capsule
    effect: supply_up
    scope: [sticker]
    confidence: high


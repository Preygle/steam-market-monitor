    confidence: high

  - date: 2026-07-08
    name: ">>> ARMORY ROTATION - Arabesque + Spy Tech collections, Fruits & Veggies + Auto Racing stickers <<<"
    category: armory_rotation
    effect: supply_up
    scope: [skin, sticker]
    note: >

    name: MAJOR STICKER SYSTEM REPLACED - capsules -> token "Major Shop"
    category: market_policy
    effect: demand_down
    scope: [sticker]
    note: >
      STRUCTURAL BREAK. Ends the capsule crash-then-recover pattern for
      Major stickers. Sticker prices now move continuously with demand.
      Any model trained on pre-2026-05-22 Major sticker behaviour is
      INVALID after this date.
    confidence: high

  - date: 2026-06-02
    name: IEM Cologne Major 2026 begins
    category: major
    effect: demand_up
